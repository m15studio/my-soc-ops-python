<div id="game-container">
<div class="start-screen">
    <div class="start-orbs">
        <div class="start-orb">B</div>
        <div class="start-orb">I</div>
        <div class="start-orb">N</div>
        <div class="start-orb">G</div>
        <div class="start-orb">O</div>
    </div>
    <div class="start-content">
        <div class="start-badge"><span aria-hidden="true">⭐</span> Social Bingo <span aria-hidden="true">⭐</span></div>
        <h1 class="start-title">Soc Ops</h1>
        <span class="start-title-accent"></span>
        <p class="start-tagline">Find your people. Win the room.</p>
        <div class="start-rules">
            <p class="start-rules-title">How to play</p>
            <div class="start-rule">
                <div class="rule-step">1</div>
                <span>Find people who match the questions on your card</span>
            </div>
            <div class="start-rule">
                <div class="rule-step">2</div>
                <span>Tap a square when you find a match</span>
            </div>
            <div class="start-rule">
                <div class="rule-step">3</div>
                <span>Get 5 in a row to win!</span>
            </div>
        </div>
        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="start-btn">
            Start Game
            <span class="start-btn-arrow">→</span>
        </button>
    </div>
</div>
</div>
