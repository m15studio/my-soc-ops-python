<div id="game-container">
    <div class="flex flex-col items-center justify-center min-h-full"
        style="background:var(--bg); padding: 2.5rem 1.5rem;">
        <div class="text-center" style="max-width: 22rem; width: 100%;">

            <!-- Wordmark -->
            <div style="margin-bottom: 0.25rem;">
                <span class="font-serif tracking-tight"
                    style="font-size: 3.5rem; color: var(--ink); line-height: 1;">Soc Ops</span>
            </div>
            <p class="text-sm tracking-wide"
                style="color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 3rem;">
                Social Bingo</p>

            <!-- How to play -->
            <div style="border-top: 1px solid var(--border); padding-top: 1.5rem; margin-bottom: 3rem;">
                <ol class="text-left" style="list-style: none; padding: 0; margin: 0;">
                    <li
                        style="display: flex; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); color: var(--ink); font-size: 0.8125rem;">
                        <span class="text-accent" style="font-weight: 500; min-width: 1.2rem;">1.</span>
                        <span>Meet someone who matches a square</span>
                    </li>
                    <li
                        style="display: flex; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); color: var(--ink); font-size: 0.8125rem;">
                        <span class="text-accent" style="font-weight: 500; min-width: 1.2rem;">2.</span>
                        <span>Tap the square to mark it</span>
                    </li>
                    <li
                        style="display: flex; gap: 0.75rem; padding: 0.6rem 0; color: var(--ink); font-size: 0.8125rem;">
                        <span class="text-accent" style="font-weight: 500; min-width: 1.2rem;">3.</span>
                        <span>Five in a row wins</span>
                    </li>
                </ol>
            </div>

            <!-- CTA -->
            <button hx-post="/start" hx-target="#game-container" hx-swap="outerHTML"
                class="w-full bg-accent text-white transition-colors"
                style="padding: 1rem 2rem; font-size: 0.875rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; border-radius: 2px;">
                Start Game
            </button>
        </div>
    </div>
</div>
