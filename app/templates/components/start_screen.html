<div id="game-container">
<div class="ss-root">
    <div class="ss-grid-bg"></div>

    <div class="ss-content">
        <div class="ss-hero">
            <div class="ss-eyebrow">Social Bingo</div>
            <h1 class="ss-title">Soc Ops</h1>
            <p class="ss-tagline">Find your people. Fill your card. Win the room.</p>
        </div>

        <div class="ss-steps">
            <h2 class="ss-steps-heading">How to play</h2>
            <div class="ss-step ss-step--1">
                <span class="ss-step-num">01</span>
                <p class="ss-step-text">Find people who match each square</p>
            </div>
            <div class="ss-step ss-step--2">
                <span class="ss-step-num">02</span>
                <p class="ss-step-text">Tap to mark when you find a match</p>
            </div>
            <div class="ss-step ss-step--3">
                <span class="ss-step-num">03</span>
                <p class="ss-step-text">Get 5 in a row to win!</p>
            </div>
        </div>

        <div class="ss-cta-wrap">
            <button
                hx-post="/start"
                hx-target="#game-container"
                hx-swap="outerHTML"
                class="ss-cta">
                <span class="ss-cta-text">Start Game</span>
                <span class="ss-cta-arrow" aria-hidden="true"></span>
            </button>
        </div>
    </div>
</div>
</div>
